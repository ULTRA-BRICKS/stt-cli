[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-cli"
version = "0.3.4"
description = "Speech-to-text for any audio/video file on macOS: VAD-gated transcription, hallucination and loop scrubbing, decoding variants with confidence, optional LLM correction and speaker diarization, all cached in a local content-addressed archive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["speech-to-text", "whisper", "transcription", "asr", "macos", "diarization", "vad"]

# ZERO required third-party runtime deps. The default engine is the whisper.cpp binary
# (or mlx-whisper, installed into its own uv-managed environment on demand) and every
# media operation shells out to ffmpeg/ffprobe. Everything else is stdlib, so the tool
# installs in seconds and a broken optional extra can never break the core path.
dependencies = []

[project.optional-dependencies]
# The MLX engine. Optional because whisper.cpp users never need it, and because it is
# Apple-Silicon-only. `stt setup` installs it on demand.
mlx = ["mlx-whisper>=0.4"]
# Speaker diarization. Heavy (torch + pyannote, ~2.5 GB) and gated behind a Hugging Face
# token, so it is NEVER a default install: `stt diarize install` pulls it when asked.
diarize = ["pyannote.audio>=3.1", "torch>=2.2"]
# `stt mic` as a MANAGED SERVICE (run/start/status/stop/enable/disable + launchd/systemd
# autostart, and the global push-to-talk hotkey daemon) is powered by the shared
# `agenttools_service` lib — ONE service-manager every long-running agent-tools server reuses
# (the review dashboard, spec-web, and now `stt mic`), instead of hand-rolling pidfiles/
# autostart units per tool. It is an IN-ECOSYSTEM dependency
# (agent-tools/lib/agenttools_service, itself stdlib-only + agenttools-daemon), not on PyPI,
# so it CANNOT be listed as a normal dep. Install editable from the agent-tools checkout:
#   pip install -e <agent-tools>/lib/agenttools_daemon -e <agent-tools>/lib/agenttools_service
# The lazy import in commands/mic.py emits an actionable error (exit 127) if it is missing.
# NOTE: this extra intentionally lists no PyPI packages — the dep is an in-ecosystem local
# install. `stt mic run` (ad-hoc, foreground) and a bare `stt mic` work without it regardless.
service = []
test = ["pytest", "pytest-asyncio"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
stt = "stt_cli.cli:main"

[project.urls]
Homepage = "https://github.com/alex-mextner/stt-cli"
Issues = "https://github.com/alex-mextner/stt-cli/issues"

[tool.setuptools.packages.find]
include = ["stt_cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 flag "ambiguous" Cyrillic characters. This is a transcription tool: the
# hallucination phrase list, the tests and the prompts are DELIBERATELY multilingual, and
# every Cyrillic character in them is data, not a mistyped Latin one.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Optional engines are imported lazily and are not installed in the type-check env.
# `_colorize` is CPython's own, present from 3.13 on but absent from the 3.11 typeshed.
[[tool.mypy.overrides]]
module = ["mlx_whisper.*", "pyannote.*", "torch.*", "_colorize"]
ignore_missing_imports = true
# The in-ecosystem `agenttools_service` lib (see the `service` extra above) is not on PyPI
# and carries no bundled type stubs available to this checkout's type-check env.
[[tool.mypy.overrides]]
module = ["agenttools_service.*"]
ignore_missing_imports = true
