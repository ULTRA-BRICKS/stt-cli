name: Voz public-corpus pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Record the actual compute devices, not assumptions about M-series
        run: |
          mkdir -p report
          swift tools/ane_probe.swift | tee report/ane.json
          sw_vers | tee report/host.txt
          sysctl -n machdep.cpu.brand_string | tee -a report/host.txt
          sysctl -n hw.memsize | tee -a report/host.txt
      - name: Install the verified native release
        run: |
          mkdir -p "$RUNNER_TEMP/voz"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/Desert-Ant-Labs/desert-ant-cli/releases/download/v0.1.1/desertant-darwin-arm64.tar.gz \
            -o "$RUNNER_TEMP/voz.tar.gz"
          echo "1d87de0de8b1115a4c01b165dfa7f4933cd7f1489b51ae48d41264dd9d427ec0  $RUNNER_TEMP/voz.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/voz.tar.gz" -C "$RUNNER_TEMP/voz"
          binary="$(find "$RUNNER_TEMP/voz" -type f -name desertant -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "STT_VOZ_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" schema --json > report/schema.json
      - name: Install and identify the CPU baseline
        run: |
          brew install whisper-cpp
          brew list --versions whisper-cpp | tee report/whisper-version.txt
          real_binary="$(command -v whisper-cli)"
          shasum -a 256 "$real_binary" | tee report/whisper-binary-sha256.txt
          "$real_binary" --help > report/whisper-help.txt 2>&1
          mkdir -p "$RUNNER_TEMP/whisper-cpu/build/bin"
          printf '#!/bin/sh\nexec "%s" --no-gpu "$@"\n' "$real_binary" > "$RUNNER_TEMP/whisper-cpu/build/bin/whisper-cli"
          chmod +x "$RUNNER_TEMP/whisper-cpu/build/bin/whisper-cli"
          echo "STT_WHISPERCPP_ROOT=$RUNNER_TEMP/whisper-cpu" >> "$GITHUB_ENV"
      - name: Prepare a public human-labelled corpus, never private recordings
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          curl --fail --location --retry 1 --max-time 180 \
            https://www.openslr.org/resources/12/test-clean.tar.gz \
            -o "$RUNNER_TEMP/test-clean.tar.gz"
          test "$(md5 -q "$RUNNER_TEMP/test-clean.tar.gz")" = 32fa31d27d2e1cad72775fee3f4849a9
          tar -xzf "$RUNNER_TEMP/test-clean.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/LibriSpeech/LICENSE.TXT" report/corpus-license.txt
          cp "$RUNNER_TEMP/LibriSpeech/SPEAKERS.TXT" report/corpus-speakers.txt
      - name: Attempt real inference, including bounded VM fallback when no ANE exists
        run: |
          uv run --python 3.13 --extra mlx python tools/voz_experiment.py \
            "$RUNNER_TEMP/LibriSpeech/test-clean" report | tee report/experiment.log
      - name: Preserve diagnostics even when models cannot run
        if: always()
        run: |
          mkdir -p report
          uv sync --python 3.11 --extra dev
          uv run --python 3.11 --extra dev ruff check . > report/lint.txt || true
          uv run --python 3.11 --extra dev ruff format --diff > report/format.diff || true
          uv run --python 3.11 --extra dev mypy stt_cli > report/types.txt || true
          tar -czf report/source.tgz stt_cli tests tools docs .github pyproject.toml conftest.py README.md AGENTS.md
      - name: Public pilot evidence (NOT a physical-Mac Neural Engine benchmark)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voz-public-corpus-pilot
          path: report/
          retention-days: 14
