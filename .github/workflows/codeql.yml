# CodeQL SELF-GATE — for a PRIVATE repo WITHOUT GitHub Advanced Security, run via the
# OPEN-SOURCE CodeQL CLI directly (NOT github/codeql-action).
#
# WHY NOT github/codeql-action (stt-cli#55): it is not just an orchestration wrapper
# around the CLI — its FIRST network call (`getGitHubVersionFromApi` in codeql-action's
# api-client.ts) is `apiClient.rest.meta.get()` against `${GITHUB_API_URL}/meta`, GitHub's
# REST "meta" endpoint used to tell GHES apart from dotcom. Forgejo's Gitea-compatible API
# has no such route, so on this host every codeql-action invocation 404s before any
# analysis starts — every run, unconditionally, regardless of what changed. Reproduced
# byte-for-byte: `curl https://<forgejo-host>/api/v1/meta` returns the exact literal
# "404 page not found" body the Action logged (`::error::404 page not found`). This is not
# an environment gap (no missing CLI, no cache dir to create) — codeql-action is
# architecturally coupled to GitHub's REST API surface and cannot be pointed at a Forgejo
# instance. So this workflow drives the real, open-source CodeQL CLI directly: each matrix
# job downloads ONE per-language "slim" bundle straight from a codeql-action GitHub
# *release asset* — a plain public HTTPS download, not a GitHub API call, so it works from
# any git host because it never asks the git host anything — then runs
# `codeql database create` / `codeql database analyze` itself. Everything downstream (SARIF
# shape, the in-job gate below, the suppression syntax already used elsewhere in this repo's
# workflows) is unchanged: codeql-action was only ever a thin wrapper around these same two
# CLI commands. Verified end-to-end against this repo's actual source (Docker, linux/amd64):
# python and javascript-typescript both come back clean; the `actions` language finds the 4
# real, pre-existing, already-`codeql[...]`-suppressed findings in dependency-review.yml /
# leftover-grep.yml and correctly suppresses them, landing on a genuine gated=0 pass.
#
# Without GHAS, the Code Scanning dashboard is unavailable: uploading SARIF 403s
# ("Advanced Security must be enabled"), so the normal `codeql/workflow.yml` can't gate.
# This variant runs the SAME analysis but keeps the SARIF LOCAL and gates on it in-job —
# a required check that fails on findings, with $0 of GHAS and no branch-protection UI.
#
# INSTALL: copy to .github/workflows/codeql.yml (use INSTEAD of workflow.yml, not both).
# Give the job a DISTINCT `name:` if your repo also has an orphaned UI "Default Setup"
# CodeQL whose hollow checks you exempt elsewhere — a distinct name moves THIS gate out
# of that exemption so your merge gate (e.g. ci/ship) requires it.
#
# SEVERITY FLOOR (knob): GATE_LEVELS below selects which SARIF result levels FAIL the job.
#   error            — only the highest-severity findings gate (loosest)
#   "error warning"  — error + warning gate (recommended; this is the default)
# Notes (recommendations) are always reported, never gating.
#
# IN-SOURCE SUPPRESSION: a finding is suppressed iff the flagged line OR ANY line in the
# contiguous comment block directly above it carries `// codeql[<exact-rule-id>]` (a
# multi-line justification works; the walk stops at the first blank/non-comment line so a
# marker can't leak across statements). Keeps suppressions greppable, reviewable, and
# reasoned — not a silent baseline. This gate always implements suppression itself; it
# never runs codeql-action's own alert-suppression queries, since it never runs
# codeql-action at all.
#
# BUNDLE PINNING: CODEQL_BUNDLE_VERSION below (env) pins the exact codeql-action release
# tag the per-language bundle is downloaded from. Unlike the SHA-pinned actions elsewhere in
# this repo, a release TAG (and its assets) is technically mutable on GitHub, and
# codeql-action does not publish per-asset checksums for the per-language bundles (only for
# the full multi-language bundle) — so this workflow pins its own: the SHA-256 of each of the
# three per-language assets, computed directly from this exact CODEQL_BUNDLE_VERSION and
# hardcoded in the download step, verified BEFORE the downloaded tarball is extracted or any
# part of it executed. (A `codeql version` string match runs as a secondary sanity check
# AFTER that — it catches a stale/typo'd hash table, not a supply-chain attack; verifying a
# binary's own self-reported version necessarily means already having executed it once.)
# Bump CODEQL_BUNDLE_VERSION and all three SHA-256 hashes together; each matrix job downloads
# only the ~100-140MB slim bundle for its own language.
#
# LANGUAGE NOT PRESENT IN THE REPO (resilience): the matrix ships with a broad default set
# (javascript-typescript + actions). If a repo has NO source for a matrix language (e.g. a
# Python-only CLI has zero JS/TS), CodeQL's buildless extractor errors with "No source code
# seen" (exit 32) and the analyze step HARD-FAILS — which would block the gate on a repo it
# was never meant to scan. To stay resilient, a preflight step detects whether the repo
# actually contains source for the matrix language and SKIPS analysis cleanly when it does
# not (a clear notice, job stays green). Where source IS present the gate runs and BLOCKS
# normally — nothing is silently disabled. Trim the matrix to your real stack to skip the
# probe entirely.

name: CodeQL Self-Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# No `security-events: write` — this gate does NOT upload to Code Scanning (no GHAS). No
# `actions: read` either — that was only ever needed by codeql-action's own API calls.
permissions:
  contents: read

env:
  # Severity floor — which SARIF levels fail the job. See header.
  GATE_LEVELS: 'error warning'
  # Exact codeql-action release tag the per-language CLI bundle is downloaded from. See
  # "BUNDLE PINNING" in the header for why this pins a tag instead of a SHA/checksum.
  CODEQL_BUNDLE_VERSION: 'codeql-bundle-v2.27.1'

jobs:
  analyze:
    name: CodeQL Self-Gate (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect source for this language
        id: detect
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -uo pipefail
          # Does the repo actually contain source for this matrix language? If not, CodeQL's
          # buildless extractor would fatally error ("No source code seen", exit 32). We probe
          # the tracked files up front and skip cleanly for an absent language instead — so the
          # broad default matrix doesn't hard-fail on a repo that simply isn't that language.
          # Where source IS present this is a no-op and the real gate runs below.
          case "$LANGUAGE" in
            javascript-typescript)
              pattern='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue|svelte)$' ;;
            python)
              pattern='\.py$' ;;
            actions)
              # CodeQL's "actions" language analyzes workflow files under .github/workflows.
              pattern='^\.github/workflows/.*\.(yml|yaml)$' ;;
            *)
              # Unknown/compiled language — don't guess; let CodeQL decide (no skip).
              echo "has_source=true" >> "$GITHUB_OUTPUT"
              echo "No presence heuristic for '$LANGUAGE'; running analysis unconditionally."
              exit 0 ;;
          esac
          # Do NOT pipe `git ls-files | grep -q` (agent-tools#129): under `pipefail`, grep -q
          # exits 0 on the FIRST match and closes the pipe, so git ls-files dies with SIGPIPE
          # (141) and the pipeline status becomes 141 even though source WAS found → the `if`
          # takes the else branch → CodeQL silently SKIPS a language it should scan (the gate
          # self-disables). Materialize the file list first, then grep it with no pipe, and
          # fail the gate if listing the tracked files itself errors (never skip on a detect
          # error — that is also a silent self-disable).
          tracked="$(git ls-files)" || {
            echo "::error::CodeQL detect: 'git ls-files' failed for ${LANGUAGE} — cannot determine source presence. Failing closed." >&2
            exit 1
          }
          # Count matches from the materialized list; rc still distinguishes no-match from
          # grep error.
          grep_rc=0
          match_count="$(grep -ciE "$pattern" <<<"$tracked")" || grep_rc=$?
          if [ "$grep_rc" -gt 1 ]; then
            echo "::error::CodeQL detect: grep errored (rc=$grep_rc) for ${LANGUAGE} — cannot determine source presence. Failing closed." >&2
            exit 1
          fi
          if [ "${match_count:-0}" -gt 0 ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
            echo "Found ${LANGUAGE} source — running CodeQL."
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeQL ${LANGUAGE} skipped::No ${LANGUAGE} source found in this repo — skipping CodeQL for this language (nothing to scan). This is a clean skip, not a failure. Remove '${LANGUAGE}' from the matrix to drop this notice, or add source to enable the gate."
          fi

      - name: Resolve bundle language + CLI dir
        # Maps the matrix's codeql-action-style language name to the codeql-action release
        # asset name (`javascript-typescript` -> `javascript`; python/actions match as-is)
        # and to the qlpack prefix the security-extended suite path uses below.
        if: steps.detect.outputs.has_source == 'true'
        id: cli
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            javascript-typescript) BUNDLE_LANG=javascript ;;
            *) BUNDLE_LANG="$LANGUAGE" ;;
          esac
          echo "bundle-lang=${BUNDLE_LANG}" >> "$GITHUB_OUTPUT"
          echo "dir=${RUNNER_TEMP:-/tmp}/codeql-cli-${BUNDLE_LANG}" >> "$GITHUB_OUTPUT"

      - name: Download CodeQL CLI (per-language bundle, direct GitHub release asset)
        if: steps.detect.outputs.has_source == 'true'
        shell: bash
        env:
          BUNDLE_LANG: ${{ steps.cli.outputs.bundle-lang }}
          CLI_DIR: ${{ steps.cli.outputs.dir }}
        run: |
          set -euo pipefail
          # zstd (the CLI, not just libzstd) is required to unpack the bundle; not every
          # runner image ships it, so install it once if missing.
          command -v zstd >/dev/null 2>&1 || {
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq zstd
            else
              apt-get update -qq && apt-get install -y -qq zstd
            fi
          }
          asset="codeql-bundle-${BUNDLE_LANG}-linux64.tar.zst"
          url="https://github.com/github/codeql-action/releases/download/${CODEQL_BUNDLE_VERSION}/${asset}"
          echo "Downloading ${url}"
          dest="${RUNNER_TEMP:-/tmp}/${asset}"
          curl -fsSL --max-time 300 --retry 3 -o "$dest" "$url"
          # Verify the downloaded tarball's SHA-256 BEFORE extracting or executing ANYTHING
          # from it: github/codeql-action publishes no checksum for these per-language slim
          # assets (only for the full multi-language bundle), so the three hashes below were
          # computed directly from this exact CODEQL_BUNDLE_VERSION's release assets and are
          # pinned here the same way a SHA-pinned action pins a commit — re-verify and update
          # both together on every CODEQL_BUNDLE_VERSION bump. This is a REAL pre-execution
          # integrity gate, unlike the post-extraction `codeql version` string check below: a
          # moved/re-pushed tag or a replaced release asset now fails closed here, before the
          # `tar` archive is even opened, rather than after the CLI binary has already run.
          case "$BUNDLE_LANG" in
            python)     expected_sha256="ea86393c6c812542ae5a3a7122bcc760873707a50b25cc47d2fd7cfd514b0cb0" ;;
            javascript) expected_sha256="8d30281899f150633913b08cf4eae755be607f282d643ad418ad638f4210e833" ;;
            actions)    expected_sha256="71247327cf3afe4115acc546fe3ac77f2865928205d7688d6a0b7153e055603f" ;;
            *)
              echo "::error::CodeQL CLI download: no pinned SHA-256 for bundle language '${BUNDLE_LANG}' — add one (see this step's comment) before adding a new matrix language. Refusing to run an unverified download." >&2
              exit 1
              ;;
          esac
          actual_sha256="$(sha256sum "$dest" 2>/dev/null | awk '{print $1}')"
          if [ -z "$actual_sha256" ]; then
            actual_sha256="$(shasum -a 256 "$dest" | awk '{print $1}')"
          fi
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::CodeQL CLI download: SHA-256 mismatch for ${asset} — expected ${expected_sha256}, got ${actual_sha256}. The release tag/asset may have moved out from under this pin, or the download was tampered with in transit. Refusing to extract or run it." >&2
            exit 1
          fi
          mkdir -p "$CLI_DIR"
          tar -xf "$dest" -C "$CLI_DIR"
          rm -f "$dest"
          # Secondary sanity check, AFTER the real (pre-extraction) SHA-256 integrity gate
          # above: confirms the extracted CLI's own self-reported version agrees with
          # CODEQL_BUNDLE_VERSION, catching a copy/paste error in the hash table itself rather
          # than a supply-chain attack (that's the SHA-256 check's job). One call, captured and
          # echoed, rather than running the binary twice.
          version_output="$("$CLI_DIR/codeql/codeql" version)"
          echo "$version_output"
          expected_version="${CODEQL_BUNDLE_VERSION#codeql-bundle-v}"
          # Match the CLI's own stable, long-documented plain-text format ("CodeQL
          # command-line toolchain release X.Y.Z.") rather than a specific --format value,
          # since that text has been consistent across CLI releases for years.
          case "$version_output" in
            *"release ${expected_version}."*) ;;
            *)
              echo "::error::CodeQL CLI version mismatch: expected release ${expected_version} (from CODEQL_BUNDLE_VERSION=${CODEQL_BUNDLE_VERSION}) but the downloaded bundle reports: ${version_output} — the pinned SHA-256 table above may be stale for this CODEQL_BUNDLE_VERSION. Refusing to run a CLI build that does not match." >&2
              exit 1
              ;;
          esac

      - name: Set up Python (the python extractor needs python3 on PATH even with build-mode=none)
        if: steps.detect.outputs.has_source == 'true' && matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Create CodeQL database
        if: steps.detect.outputs.has_source == 'true'
        shell: bash
        env:
          BUILD_MODE: ${{ matrix.build-mode }}
          BUNDLE_LANG: ${{ steps.cli.outputs.bundle-lang }}
          CLI_DIR: ${{ steps.cli.outputs.dir }}
        run: |
          set -euo pipefail
          # Use BUNDLE_LANG (the codeql-CLI-native id), not the raw matrix language: the CLI
          # has no `javascript-typescript` alias (that's a codeql-action-only name) — create
          # must match the language the downloaded bundle/extractor actually is, same as the
          # analyze step below already does.
          "$CLI_DIR/codeql/codeql" database create "${RUNNER_TEMP:-/tmp}/codeql-db" \
            --language="$BUNDLE_LANG" --source-root="$GITHUB_WORKSPACE" \
            --build-mode="${BUILD_MODE:-none}"

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.has_source == 'true'
        shell: bash
        env:
          BUNDLE_LANG: ${{ steps.cli.outputs.bundle-lang }}
          CLI_DIR: ${{ steps.cli.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p sarif-results
          "$CLI_DIR/codeql/codeql" database analyze "${RUNNER_TEMP:-/tmp}/codeql-db" \
            --format=sarif-latest \
            --output="sarif-results/${BUNDLE_LANG}.sarif" \
            --sarif-add-baseline-file-info \
            "codeql/${BUNDLE_LANG}-queries:codeql-suites/${BUNDLE_LANG}-security-extended.qls"

      - name: Upload SARIF artifact
        # Publish the raw SARIF even on a gate failure, so it's downloadable
        # (`gh run download`) for triage. Skipped when the language wasn't analyzed.
        if: always() && steps.detect.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Gate on SARIF findings
        # Skip entirely when the language is absent (handled by the detect step above).
        if: always() && steps.detect.outputs.has_source == 'true'
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No SARIF produced for ${LANGUAGE} — analysis did not emit results." >&2
            exit 1
          fi

          # Which levels gate (from GATE_LEVELS env). Build a quick membership test.
          is_gated_level() {
            local lvl="$1" g
            for g in ${GATE_LEVELS:-error warning}; do
              [ "$lvl" = "$g" ] && return 0
            done
            return 1
          }

          # is_source_suppressed <ruleId> <uri> <startLine> -> rc 0 if suppressed.
          # Honors a `codeql[<ruleId>]` marker on the flagged line OR in the contiguous block
          # of comment lines directly above it (so a multi-line justification works — the
          # marker need only be somewhere in the attached comment block, not on one exact
          # line). Both comment styles match: `// codeql[...]` (JS/TS) or `# codeql[...]`
          # (YAML for the `actions` language, Python, shell). The scan walks upward and stops
          # at the first non-comment / blank line so a marker can't leak across steps. Keeps
          # suppressions greppable + reviewable — not a silent baseline.
          is_source_suppressed() {
            local rid="$1" src="$2" line="$3" n txt
            # Match `//` or `#` (with optional indent), then `codeql[<exact rule id>]`.
            local re="(//|#)[[:space:]]*codeql\[$(printf '%s' "$rid" | sed 's/[][\.*^$/]/\\&/g')\]"
            # Any line whose first non-space char is `#` or `//` counts as a comment line.
            local comment_re='^[[:space:]]*(#|//)'
            [ -f "$src" ] || return 1
            [ "$line" -gt 0 ] 2>/dev/null || return 1
            # Flagged line itself.
            sed -n "${line}p" "$src" 2>/dev/null | grep -qE "$re" && return 0
            # Walk upward through the contiguous comment block directly above the flagged line.
            n=$((line - 1))
            while [ "$n" -ge 1 ]; do
              txt="$(sed -n "${n}p" "$src" 2>/dev/null)"
              printf '%s' "$txt" | grep -qE "$comment_re" || break   # stop at first non-comment
              printf '%s' "$txt" | grep -qE "$re" && return 0
              n=$((n - 1))
            done
            return 1
          }

          gated=0; notes=0; suppressed=0
          echo "=== CodeQL findings for ${LANGUAGE} ==="

          for f in "${files[@]}"; do
            # Resolve each result's effective level (per-result level overrides the rule
            # default; default to "warning" per the SARIF spec when unspecified).
            # TSV: <sarifSuppressed>\t<level>\t<ruleId>\t<uri>\t<startLine>\t<msg>
            jq -r '
              .runs[] as $run
              | ( [ $run.tool.driver.rules[]?
                    | { key: .id, value: ( .defaultConfiguration.level // "warning" ) } ]
                  | from_entries ) as $ruleLevel
              | $run.results[]?
              | ( .level // $ruleLevel[.ruleId] // "warning" ) as $lvl
              | ( ( ( .suppressions // [] ) | length > 0 ) | tostring ) as $sarifSup
              | ( .locations[0].physicalLocation as $pl
                  | [ $sarifSup, $lvl, (.ruleId // "?"),
                      ( $pl.artifactLocation.uri // "?" ),
                      ( ($pl.region.startLine // 0) | tostring ),
                      ( .message.text // "" | gsub("[\t\n]"; " ") ) ] )
              | @tsv
            ' "$f" > findings.tsv || { echo "::error::Failed to parse $f" >&2; exit 1; }

            while IFS=$'\t' read -r sarifSup lvl rule uri line msg; do
              [ -z "${lvl:-}" ] && continue
              loc="${uri}:${line}"
              if [ "$sarifSup" = "true" ] || is_source_suppressed "$rule" "$uri" "$line"; then
                suppressed=$((suppressed+1))
                echo "  suppr.  [$lvl] $rule  $loc — $msg (in-source suppression)"
              elif is_gated_level "$lvl"; then
                gated=$((gated+1))
                echo "::error file=${uri},line=${line}::[$lvl] $rule — $msg"
                echo "  GATED   [$lvl] $rule  $loc — $msg"
              elif [ "$lvl" = "note" ]; then
                notes=$((notes+1))
                echo "  note    [$lvl] $rule  $loc — $msg"
              else
                echo "  other   [$lvl] $rule  $loc — $msg"
              fi
            done < findings.tsv
          done

          echo "=== Summary (${LANGUAGE}): gated=$gated, suppressed=$suppressed, notes=$notes ==="
          {
            echo "### CodeQL — ${LANGUAGE}"
            echo ""
            echo "- Gated (${GATE_LEVELS}): **$gated**"
            echo "- Suppressed (in-source, justified): $suppressed"
            echo "- Notes (recommendation): $notes"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$gated" -gt 0 ]; then
            echo "::error::CodeQL gate FAILED for ${LANGUAGE}: $gated gated finding(s). See annotations." >&2
            exit 1
          fi
          echo "CodeQL gate PASSED for ${LANGUAGE}: 0 gated ($suppressed suppressed, $notes note(s))."
